name: Test and deploy to GitHub Pages

on:
  push:
    # The repository's default branch is currently claude/exciting-cori-k1d1ib, and GitHub's
    # "github-pages" environment only accepts deployments from the default branch. Once the
    # default is switched to main, the second entry can be removed.
    branches: [main, claude/exciting-cori-k1d1ib]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # GitHub project sites are served from /<repo>/, so the app is built with that base path.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
